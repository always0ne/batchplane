name: BatchTrail Gate
description: Verify BatchTrail execution authorization before business steps run.
outputs:
  result:
    description: Gate decision (ALLOW or DENY)
  reason_code:
    description: Machine-readable denial reason code
  message:
    description: Human-readable decision message
inputs:
  mode:
    required: true
    description: lite or server
  batch-id:
    required: true
    description: Batch definition ID
  config-path:
    required: false
    default: .batch-governance
    description: BatchTrail repository config path
  ref:
    required: false
    description: Repository ref that contains the governed batch definition
  schedule-id:
    required: false
    description: Schedule identifier for schedule-triggered executions
  request-id:
    required: false
    description: Execution request ID for manual executions
  approval-source:
    required: false
    description: Approval evidence source
  approval-ref:
    required: false
    description: Approval evidence reference
  request-digest:
    required: false
    description: Approved request digest
  github-token:
    required: false
    description: GitHub token used to read execution request and approval evidence
  dispatcher-actor:
    required: false
    default: github-actions[bot]
    description: GitHub actor expected for dispatcher-triggered workflow runs
runs:
  using: node24
  main: dist/index.js
