name: BatchPlane Schedule Request
description: Record a native GitHub Actions scheduled execution occurrence.
outputs:
  status:
    description: Request handling result
  issue-number:
    description: GitHub issue number for the scheduled execution request
  request-id:
    description: BatchPlane execution request ID
  request-digest:
    description: BatchPlane execution request digest
  failure-reason:
    description: Machine-readable controller denial reason when no request output exists
inputs:
  batch-id:
    required: true
    description: Batch definition ID
  schedule-id:
    required: true
    description: Schedule identifier
  cron:
    required: true
    description: Cron expression for the governed schedule
  timezone:
    required: true
    description: IANA timezone for the governed schedule
  definition-path:
    required: true
    description: Batch definition file path
  config-path:
    required: false
    default: .batch-governance
    description: BatchPlane repository config path
  github-token:
    required: true
    description: GitHub token used to create request evidence
runs:
  using: node24
  main: dist/index.js
