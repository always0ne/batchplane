name: BatchPlane Dispatcher
description: Dispatch approved BatchPlane Lite execution requests.
inputs:
  issue-number:
    required: true
    description: Execution request issue number
  comment-id:
    required: true
    description: Triggering approval comment ID
  config-path:
    required: false
    default: .batch-governance
    description: BatchPlane repository config path
  github-token:
    required: true
    description: GitHub token used by the dispatcher workflow
runs:
  using: node24
  main: dist/index.js
